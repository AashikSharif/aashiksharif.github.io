<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfolio - Aashik Sharif</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem 3rem;
            text-align: center;
            position: relative;
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-tabs {
            background: white;
            padding: 2rem 0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 0 2rem;
        }

        .nav-tab {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            color: #495057;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-tab:hover {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .nav-tab.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem 2rem;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.25rem; /* Further reduced from 0.5rem */
        }

        @media (min-width: 768px) {
            .photo-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 0.5rem; /* Further reduced from 0.75rem */
            }
        }

        .photo-column {
            display: grid;
            grid-auto-rows: min-content; /* Force rows to fit content, not stretch */
            gap: 0.125rem; /* Very tight spacing - reduced from 0.25rem */
        }

        @media (min-width: 768px) {
            .photo-column {
                gap: 0.25rem; /* Further reduced from 0.5rem */
            }
        }

        .photo-item {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-radius: 0.5rem;
            overflow: hidden;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .photo-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .photo-item img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            display: block;
            margin: 0;
            padding: 0;
        }

        /* Square images - only for equal dimensions */
        .photo-item.square.image-loaded {
            aspect-ratio: 1/1; /* Force square aspect ratio */
        }

        .photo-item.square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }

        /* Natural dimensions - for all non-square images */
        .photo-item.natural.image-loaded {
            width: 100% !important; /* Full width of column */
            /* Let JavaScript control the height completely - NO !important on height */
            aspect-ratio: unset !important; /* Remove any aspect ratio constraints */
            min-height: unset !important; /* Remove min-height constraints */
            max-height: unset !important; /* Remove max-height constraints */
        }

        .photo-item.natural img {
            width: 100% !important;
            height: 100% !important; /* Fill the container completely */
            object-fit: cover !important; /* Cover the container while maintaining aspect ratio */
            border-radius: 0.5rem;
            display: block !important;
        }

        .photo-item.unknown img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 0.5rem;
        }

        /* Placeholder styles */
        .photo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 200px; /* Default height for unknown orientation */
            background-color: #d1d5db; /* gray-300 */
            border-radius: 0.5rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            position: relative;
        }

        /* Orientation-specific placeholder sizes */
        .photo-item.square .photo-placeholder {
            height: 200px; /* Square placeholder */
        }

        .photo-item.natural .photo-placeholder {
            height: 200px; /* Default placeholder for natural images */
        }

        .photo-placeholder svg {
            width: 2.5rem; /* w-10 */
            height: 2.5rem; /* h-10 */
            color: #9ca3af; /* gray-400 */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: .5;
            }
        }

        /* Hide image initially, show placeholder */
        .photo-item img {
            display: none;
        }

        .photo-placeholder {
            display: flex;
        }

        /* When image is loaded, hide placeholder and show image */
        .photo-item.image-loaded .photo-placeholder {
            display: none;
        }

        .photo-item.image-loaded img {
            display: block;
        }

        /* Ensure loaded containers fit content properly - only for non-specific cases */
        .photo-item.image-loaded:not(.natural):not(.square) {
            height: auto;
            min-height: auto;
            /* Removed aspect-ratio: auto to allow orientation-specific ratios */
        }

        /* Lightbox placeholder */
        .lightbox-placeholder {
            position: relative;
            width: 90vw;
            height: 60vh;
            background-color: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: -45%;
            height: 100%;
            width: 45%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.3),
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 1.5s infinite ease-in-out;
        }

        .photo-item:hover img {
            transform: scale(1.02);
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 1.5rem 1rem 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            border-radius: 0 0 0.5rem 0.5rem;
        }

        .photo-item:hover .photo-overlay {
            transform: translateY(0);
        }

        .photo-overlay h4 {
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-open {
            overflow: hidden;
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .lightbox-close:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .lightbox-nav:hover {
            background-color: rgba(255,255,255,0.2);
        }

        .lightbox-prev {
            left: -70px;
        }

        .lightbox-next {
            right: -70px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 1rem;
            }

            .back-btn {
                top: 1rem;
                left: 1rem;
            }

            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.25rem; /* Consistent with main mobile rule */
            }

            .photo-column {
                grid-auto-rows: min-content; /* Force rows to fit content on mobile too */
                gap: 0.125rem; /* Consistent with main mobile rule */
            }

            .lightbox-nav {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
                gap: 0.25rem; /* Consistent with mobile rules */
            }

            .nav-container {
                padding: 0 1rem;
            }

            .nav-tab {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html#photography" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1>Photography Portfolio</h1>
        <p>Capturing moments and stories through my lens</p>
    </header>

    <nav class="nav-tabs">
        <div class="nav-container">
            <button class="nav-tab active" data-category="all">All Photos</button>
            <button class="nav-tab" data-category="awardwinning">Award Winning</button>
            <button class="nav-tab" data-category="picturemix">Picture Mix</button>
        </div>
    </nav>

    <div class="gallery-container">
        <div class="photo-grid" id="photoGrid">
            <!-- Photos will be loaded here by JavaScript -->
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <span class="lightbox-close" id="lightboxClose">&times;</span>
            <div class="lightbox-nav lightbox-prev" id="lightboxPrev">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="lightbox-nav lightbox-next" id="lightboxNext">
                <i class="fas fa-chevron-right"></i>
            </div>
            <img src="" alt="" id="lightboxImg">
        </div>
    </div>

    <!-- Cloudinary Configuration -->
    <script src="js/cloudinary-config.js"></script>
    
    <!-- Photography Portfolio Script -->
    <script src="js/photography.js"></script>
</body>
</html>
